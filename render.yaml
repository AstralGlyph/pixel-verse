# Render 部署配置
# 文档: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pixel-verse
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node scripts/db-migrate.mjs && node scripts/db-seed.mjs && node scripts/start-server.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    autoDeploy: true
