# Render 部署配置
# 文档: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pixel-verse
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build && node scripts/db-migrate.mjs && node scripts/db-seed.mjs
    startCommand: node dist/server/entry.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    autoDeploy: true
